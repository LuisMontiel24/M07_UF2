version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: logindb
      POSTGRES_USER: django
      POSTGRES_PASSWORD: secret
    ports:
      - "5431:5431"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:81"
    depends_on:
      - db

volumes:
  postgres_data: